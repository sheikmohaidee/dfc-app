<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Hind+Madurai:wght@300;400;500;600&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#FFFFFF;color:#09090B;font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
    a{color:#2563EB;text-decoration:none}a:hover{color:#1D4ED8}
    .ta{font-family:'Hind Madurai','Noto Sans Tamil','Nirmala UI',sans-serif}
    .mn{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
    @keyframes ring{0%{transform:scale(1);opacity:.5}70%{transform:scale(1.4);opacity:0}100%{opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  </style>
</helmet>

<div style="position:relative; width:390px; height:844px; overflow:hidden; background:#FFFFFF">

  <!-- App behind the overlay -->
  <div style="position:absolute; inset:0; padding:56px 20px 0 20px; display:flex; flex-direction:column; gap:18px">
    <div style="display:flex; align-items:center; gap:10px">
      <div style="width:28px; height:28px; border-radius:8px; background:#18181B; display:flex; align-items:center; justify-content:center; color:#FAFAFA; font-size:12px; font-weight:600; letter-spacing:-.02em">D</div>
      <div style="font-size:15px; font-weight:600; letter-spacing:-.01em">DFC</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px">
      <div style="width:210px; height:12px; border-radius:6px; background:#F4F4F5"></div>
      <div style="width:150px; height:12px; border-radius:6px; background:#F4F4F5"></div>
      <div style="width:238px; height:120px; border-radius:12px; background:#F4F4F5; align-self:flex-end"></div>
      <div style="width:180px; height:12px; border-radius:6px; background:#F4F4F5"></div>
    </div>
  </div>

  <!-- Scrim -->
  <div style="position:absolute; inset:0; background:rgba(9,9,11,.58); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px)"></div>

  <!-- Biometric sheet -->
  <div style="position:absolute; left:0; right:0; bottom:0; background:#FFFFFF; border-top:1px solid #E4E4E7; border-radius:20px 20px 0 0; box-shadow:0 -12px 40px rgba(9,9,11,.22); padding:12px 20px 28px 20px; display:flex; flex-direction:column; gap:0">

    <div style="width:36px; height:4px; border-radius:2px; background:#E4E4E7; margin:0 auto 24px auto"></div>

    <!-- Fingerprint -->
    <div style="position:relative; width:112px; height:112px; margin:0 auto 20px auto; display:flex; align-items:center; justify-content:center">
      <div style="position:absolute; inset:0; border-radius:56px; border:1.5px solid #18181B; animation:ring 2.4s cubic-bezier(.2,.6,.3,1) infinite"></div>
      <div style="position:absolute; inset:0; border-radius:56px; background:#FAFAFA; border:1px solid #E4E4E7"></div>
      <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="#18181B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="position:relative">
        <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
        <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
        <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
        <path d="M2 12a10 10 0 0 1 18-6"/>
        <path d="M2 16h.01"/>
        <path d="M21.8 16c.2-2 .131-5.354 0-6"/>
        <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/>
        <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
        <path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>
      </svg>
    </div>

    <div style="text-align:center; display:flex; flex-direction:column; gap:5px; margin-bottom:22px">
      <div style="font-size:21px; font-weight:600; letter-spacing:-.02em">Unlock DFC</div>
      <div class="ta" style="font-size:13px; color:#71717A">DFC-ஐ கைரேகை மூலம் திறக்கவும்</div>
      <div class="mn" style="font-size:12px; color:#A1A1AA; margin-top:6px">+91 98••• ••210</div>
    </div>

    <!-- Location auto-detect -->
    <div style="border:1px solid #E4E4E7; border-radius:12px; background:#FFFFFF; box-shadow:0 1px 2px 0 rgba(9,9,11,.05); overflow:hidden">
      <div style="display:flex; align-items:center; gap:12px; padding:13px 14px">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#71717A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        <div style="flex-grow:1; display:flex; flex-direction:column; gap:2px">
          <div style="font-size:13.5px; font-weight:500; color:#3F3F46">Detecting location…</div>
          <div class="ta" style="font-size:11px; color:#A1A1AA">இருப்பிடம் கண்டறியப்படுகிறது…</div>
        </div>
        <div style="width:16px; height:16px; border-radius:8px; border:2px solid #E4E4E7; border-top-color:#18181B; animation:spin .8s linear infinite"></div>
      </div>
      <div style="height:1px; background:#F4F4F5"></div>
      <div style="display:flex; align-items:center; gap:12px; padding:13px 14px; background:#FAFAFA; animation:rise .6s ease-out .4s both">
        <div style="width:18px; height:18px; border-radius:9px; background:#16A34A; display:flex; align-items:center; justify-content:center; flex-shrink:0">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div style="flex-grow:1; display:flex; flex-direction:column; gap:2px">
          <div style="font-size:13.5px; font-weight:600; letter-spacing:-.01em">K.K. Nagar, Madurai</div>
          <div class="mn" style="font-size:11px; color:#71717A">625020 · 2nd Main Rd</div>
        </div>
        <div style="font-size:12px; font-weight:500; color:#18181B; border:1px solid #E4E4E7; border-radius:6px; padding:5px 9px; background:#FFFFFF">Change</div>
      </div>
    </div>

    <!-- Primary -->
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px">
      <div style="height:48px; border-radius:8px; background:#18181B; color:#FAFAFA; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 1px 2px 0 rgba(9,9,11,.12)">
        <span style="font-size:15px; font-weight:500; letter-spacing:-.01em">Touch to continue</span>
      </div>
      <div style="height:44px; display:flex; align-items:center; justify-content:center">
        <span style="font-size:13.5px; color:#71717A; font-weight:500">Use OTP instead</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:4px">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span style="font-size:11px; color:#A1A1AA">Secured by device biometrics · Firebase App Check</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
